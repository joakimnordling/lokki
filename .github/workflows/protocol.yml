name: Protocol

on:
  push:
    branches: [main]
    paths: ["protocol/**", "servers/python/**", ".github/workflows/protocol.yml"]
  pull_request:
    paths: ["protocol/**", "servers/python/**", ".github/workflows/protocol.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_PYTHON_PREFERENCE: only-managed

defaults:
  run:
    working-directory: protocol

jobs:
  check:
    name: Vectors and conformance (${{ matrix.storage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [sqlite, postgresql, firestore]
    services:
      postgres:
        image: ${{ matrix.storage == 'postgresql' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: protocol
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check && uv run ruff format --check
      - name: pyright
        run: uv run pyright
      - name: Reference implementation against the test vectors
        run: uv run pytest tests
      - if: matrix.storage == 'firestore'
        uses: ./.github/actions/firestore-emulator
      - name: Conformance of servers/python
        run: uv run pytest conformance
        env:
          LOKKI_CONFORMANCE_DATABASE_URL: >-
            ${{ matrix.storage == 'firestore' && 'firestore://conformance'
            || matrix.storage == 'postgresql' && 'postgresql://postgres:postgres@127.0.0.1:5432/postgres'
            || '' }}
          FIRESTORE_EMULATOR_HOST: ${{ matrix.storage == 'firestore' && '127.0.0.1:8086' || '' }}
