name: Protocol

on:
  push:
    branches: [main]
    paths: ["protocol/**", "servers/python/**", ".github/workflows/protocol.yml"]
  pull_request:
    paths: ["protocol/**", "servers/python/**", ".github/workflows/protocol.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_PYTHON_PREFERENCE: only-managed

defaults:
  run:
    working-directory: protocol

jobs:
  check:
    name: Vectors and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: protocol
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check && uv run ruff format --check
      - name: pyright
        run: uv run pyright
      - name: Reference implementation against the test vectors
        run: uv run pytest tests
      - name: Conformance of servers/python
        run: uv run pytest conformance
