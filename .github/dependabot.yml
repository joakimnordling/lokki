# Keeps the pinned action hashes (and their version comments), the npm packages and the Python server's
# packages up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"] # the workflows and this repository's own actions
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # let a new release settle before proposing it
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # let a new release settle before proposing it
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: uv
    directory: /servers/python
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /protocol
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
