[project]
name = "lokki-server"
version = "0.1.0"
description = "Sync server for Lokki: stores end-to-end encrypted rows for any number of devices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joakim Nordling", email = "joakim.nordling@gmail.com" }]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162",
    "fastapi-standalone-docs>=0.3.0",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "typer>=0.28",
    "segno>=1.6",
]

[project.optional-dependencies]
# Storing in PostgreSQL (LOKKI_DATABASE_URL=postgresql://...): pip install lokki-server[postgresql]
postgresql = ["asyncpg>=0.32"]
# Storing in Firestore (LOKKI_DATABASE_URL=firestore://PROJECT): pip install lokki-server[firestore]
firestore = ["google-cloud-firestore>=2.34"]

[project.scripts]
lokki-server = "lokki_server.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "syrupy>=6.1",
    "httpx2>=2.16",  # FastAPI's TestClient
    "lokki-server[postgresql,firestore]",  # tests run on every storage that's available
    "ruff==0.17.4",
    "pyright==1.1.414",
]

[tool.uv]
required-version = ">=0.13.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["lokki_server"]
branch = true
# Alembic runs the migrations; tests/test_storage.py checks they match the tables
omit = ["*/lokki_server/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# CI requires 100% (--cov-fail-under), with the Firestore emulator running; without it, Firestore's
# storage isn't run locally
# Code that can't run: the type checker proves it (e.g. after every case of an enum)
exclude_also = ["assert_never\\("]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors: basic style problems
    "W",      # pycodestyle warnings: whitespace
    "F",      # Pyflakes: unused imports and variables, undefined names
    "I",      # isort: import order
    "UP",     # pyupgrade: newer syntax for the target Python version
    "B",      # flake8-bugbear: likely bugs and design problems
    "SIM",    # flake8-simplify: code that can be written more simply
    "RUF",    # Ruff's own rules, e.g. unused noqa comments
    "D213",   # a multi-line docstring starts its text on the line after the opening quotes
    "S",      # flake8-bandit: security problems
    "T10",    # flake8-debugger: leftover debugger calls
    "PT",     # flake8-pytest-style: pytest conventions
    "C4",     # flake8-comprehensions: simpler comprehensions
    "PIE",    # flake8-pie: unnecessary code
    "RET",    # flake8-return: simpler returns
    "PERF",   # Perflint: slow patterns
    "FURB",   # refurb: more modern idioms
    "ASYNC",  # flake8-async: blocking calls and other pitfalls in async code
]

[tool.ruff.lint.per-file-ignores]
# tests use plain asserts and hard-coded test tokens on purpose
"tests/*" = ["S"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.15"
typeCheckingMode = "strict"
