# See https://pre-commit.com. Install with:
#   pre-commit install --install-hooks && pre-commit install --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # Formatting and linting for JavaScript, CSS and JSON
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.4
    hooks:
      - id: biome-check

  # Spelling mistakes in code, comments and docs
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.0
    hooks:
      - id: typos
        args: [--force-exclude] # report only: never rewrite code

  # Accidentally committed secrets (tokens, keys)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
