# See https://pre-commit.com. Install with:
#   pre-commit install --install-hooks && pre-commit install --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # Formatting and linting for JavaScript, CSS and JSON
  - repo: https://github.com/biomejs/pre-commit
    rev: bc3c1d9acd69eaa1e5912f282ca563f914fd78d3 # frozen: v2.6.4
    hooks:
      - id: biome-check

  # Spelling mistakes in code, comments and docs
  - repo: https://github.com/crate-ci/typos
    rev: ef3265d70a75c507b4c110d855cdfab6ce90d4bf # frozen: v1.52.0
    hooks:
      - id: typos
        args: [--force-exclude] # report only: never rewrite code

  # Accidentally committed secrets (tokens, keys)
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce # frozen: v8.30.0
    hooks:
      - id: gitleaks

  # Python: the sync server and the protocol's reference implementation and tests
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(servers/python|protocol)/
      - id: ruff-format
        files: ^(servers/python|protocol)/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d1df990f871e616da38bb602a2671d5e840b9989 # frozen: 0.13.7
    hooks:
      - id: uv-lock
        name: uv-lock (servers/python)
        args: [--project, servers/python]
        files: ^servers/python/(pyproject\.toml|uv\.lock)$
      - id: uv-lock
        name: uv-lock (protocol)
        args: [--project, protocol]
        files: ^protocol/(pyproject\.toml|uv\.lock)$

  # GitHub Actions workflows: security problems, and mistakes (with shellcheck for run: scripts)
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        additional_dependencies:
          - github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1

  # Unit tests before every push (needs Node.js 22+)
  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: npm test
        language: system
        pass_filenames: false
        files: \.js$
        stages: [pre-push]
