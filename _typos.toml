# Metric names and test data are partly Swedish and Finnish; keep them out of spell checking.
[files]
extend-exclude = ["tests/fixtures/", "protocol/vectors/*.json", "*.woff2", "*.svg", "public/fonts/", "package-lock.json", "src/ui/lucide.js"]

[default]
# Unicode ranges in @font-face rules
extend-ignore-re = [
  "U\\+[0-9A-Fa-f?-]+",
  # Old Loggr export file names, with characters encoded as #U00e9
  "\\w*#U[0-9A-Fa-f]{4}\\w*",
]

[default.extend-words]
ser = "ser" # a chart series
nd = "nd" # 2nd, in a date pattern
