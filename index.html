<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lokki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f96f45">
<meta name="apple-mobile-web-app-title" content="Lokki">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/jost-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<!-- app:begin -->
<div class="app">
  <header class="gut" id="hdr"></header>
  <main class="gut" id="main"><div class="state"><b>Loading your logs…</b></div></main>
</div>
<div class="toolbar gut" id="toolbar" hidden><div class="in">
  <button type="button" id="tbEntries" aria-label="Import or export this metric"></button>
  <button type="button" id="tbAdd" aria-label="Add entry"></button>
  <button type="button" id="tbDelete" aria-label="Delete metric"></button>
</div></div>
<div id="layer"></div>
<input type="file" id="fileIn" accept=".csv,text/csv" multiple hidden>
<input type="file" id="bakIn" accept=".zip,.jsonl,.gz,application/zip,application/gzip,application/x-gzip,application/json" hidden>
<!-- app:end -->
<!-- development only: the builds bundle hash-wasm into the script -->
<script type="importmap">{"imports": {"hash-wasm": "./vendor/hash-wasm.js"}}</script>
<script type="module" src="src/app.js"></script>
</body>
</html>
