<head>

<meta name="apple-mobile-web-app-title" content="Lokki">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<!-- app:begin -->
<div class="app">
  <header class="gut" id="hdr"></header>
  <main class="gut" id="main"><div class="state"><b>Loading your logs…</b></div></main>
</div>
<div class="toolbar gut" id="toolbar" hidden><div class="in">
  <button type="button" id="tbEntries" aria-label="Import or export this metric"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 16 4 4 4-4"/> <path d="M7 20V4"/> <path d="m21 8-4-4-4 4"/> <path d="M17 4v16"/></svg></button>
  <button type="button" id="tbAdd" aria-label="Add entry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/> <path d="M12 5v14"/></svg></button>
  <button type="button" id="tbDelete" aria-label="Delete metric"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/> <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/> <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/> <line x1="10" x2="10" y1="11" y2="17"/> <line x1="14" x2="14" y1="11" y2="17"/></svg></button>
</div></div>
<div id="layer"></div>
<input type="file" id="fileIn" accept=".csv,text/csv" multiple hidden>
<input type="file" id="bakIn" accept=".zip,.jsonl,.gz,application/zip,application/gzip,application/x-gzip,application/json" hidden>
<!-- app:end -->
<script type="module" src="src/app.js"></script>
